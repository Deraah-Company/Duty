<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مخطط المهام الزمني التفاعلي - درعه</title>
  <style>
    :root {
      --bg: #030611;
      --panel: rgba(8, 16, 38, 0.72);
      --panel-strong: rgba(5, 10, 24, 0.86);
      --border: rgba(0, 150, 255, 0.28);
      --blue: #0055ff;
      --blue-light: #4d88ff;
      --neon: #00d4ff;
      --purple: #8b5cf6;
      --muted: #9ca3af;
      --white: #ffffff;
      --danger: #ef4444;
      --success: #10b981;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 12%, rgba(0, 85, 255, 0.22), transparent 32rem),
        radial-gradient(circle at 88% 8%, rgba(0, 212, 255, 0.12), transparent 26rem),
        var(--bg);
      color: var(--white);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    #glow {
      position: fixed;
      width: 520px;
      height: 520px;
      border-radius: 999px;
      pointer-events: none;
      background: radial-gradient(circle, rgba(0, 110, 255, 0.16), transparent 70%);
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 180ms ease;
      z-index: -1;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .glass {
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .logo {
      width: 54px;
      height: 54px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue), var(--neon));
      box-shadow: 0 0 22px rgba(0, 110, 255, 0.52);
      font-size: 26px;
      font-weight: 900;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      font-size: clamp(1.45rem, 2.2vw, 2rem);
      margin-bottom: 7px;
      line-height: 1.25;
    }

    .subtitle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--neon);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .pulse {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.8);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-start;
    }

    .section {
      border-radius: 18px;
      padding: 24px;
    }

    .input-panel {
      width: min(880px, 100%);
      margin: 0 auto;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--neon);
      font-size: 1.45rem;
    }

    .help-text {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.8;
    }

    textarea,
    input[type="text"] {
      width: 100%;
      color: var(--white);
      background: rgba(5, 10, 24, 0.82);
      border: 1px solid rgba(0, 85, 255, 0.38);
      border-radius: 12px;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    textarea:focus,
    input[type="text"]:focus {
      border-color: var(--neon);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.12);
    }

    textarea {
      min-height: 290px;
      padding: 16px;
      resize: vertical;
      line-height: 1.7;
      font-family: Consolas, "Courier New", monospace;
      margin-bottom: 18px;
    }

    input[type="text"] {
      height: 42px;
      padding: 0 14px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 10px;
      color: var(--white);
      font-weight: 800;
      transition: transform 160ms ease, filter 160ms ease, background 160ms ease;
      user-select: none;
      white-space: nowrap;
    }

    .button:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .button.primary {
      background: var(--blue);
      box-shadow: 0 0 18px rgba(0, 85, 255, 0.36);
    }

    .button.secondary {
      background: rgba(0, 85, 255, 0.16);
      border: 1px solid rgba(0, 212, 255, 0.34);
      color: var(--neon);
    }

    .button.success {
      background: linear-gradient(90deg, #059669, #22c55e);
    }

    .button.danger {
      background: rgba(239, 68, 68, 0.28);
      border: 1px solid rgba(239, 68, 68, 0.52);
    }

    .button.purple {
      background: rgba(139, 92, 246, 0.28);
      border: 1px solid rgba(139, 92, 246, 0.58);
    }

    .center-panel {
      width: min(460px, 100%);
      margin: 48px auto 0;
      text-align: center;
    }

    .big-mark {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--neon));
      box-shadow: 0 0 28px rgba(0, 212, 255, 0.34);
      font-size: 2rem;
      font-weight: 900;
    }

    .note {
      padding: 16px;
      border: 1px solid rgba(0, 85, 255, 0.34);
      border-radius: 12px;
      background: rgba(0, 85, 255, 0.1);
      margin: 18px 0 22px;
      color: #c7d2fe;
      line-height: 1.7;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .stat-card {
      min-height: 116px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(5, 10, 24, 0.58);
      color: var(--white);
      text-align: center;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .stat-card:hover,
    .stat-card.active {
      border-color: var(--neon);
      background: rgba(0, 85, 255, 0.22);
      transform: translateY(-2px);
    }

    .stat-title {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
    }

    .stat-value {
      color: var(--neon);
      font-size: 2rem;
      font-weight: 900;
      line-height: 1;
    }

    .stat-caption {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 16px;
      border-radius: 14px;
      margin: 18px 0 26px;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .segmented {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 10px;
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .segmented button {
      min-width: 64px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .segmented button.active {
      color: var(--white);
      background: var(--blue);
    }

    .search-box {
      width: min(320px, calc(100vw - 64px));
    }

    .timeline {
      position: relative;
      width: min(880px, 100%);
      margin: 0 auto;
      padding: 16px 0 42px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      right: 50%;
      width: 3px;
      transform: translateX(50%);
      border-radius: 99px;
      background: linear-gradient(to bottom, var(--neon), var(--blue), transparent);
      opacity: 0.62;
    }

    .task-row {
      position: relative;
      display: flex;
      width: 100%;
      margin: 0 0 28px;
    }

    .task-row.left {
      justify-content: flex-start;
    }

    .task-row.right {
      justify-content: flex-end;
    }

    .timeline-dot {
      position: absolute;
      top: 26px;
      right: 50%;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      transform: translateX(50%);
      background: var(--bg);
      border: 4px solid var(--neon);
      z-index: 2;
      box-shadow: 0 0 14px rgba(0, 212, 255, 0.75);
    }

    .timeline-dot.high {
      border-color: var(--danger);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.75);
    }

    .timeline-dot.low {
      border-color: #64748b;
      box-shadow: none;
    }

    .task-card {
      width: calc(50% - 34px);
      min-width: 0;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid rgba(0, 150, 255, 0.22);
      background: linear-gradient(135deg, rgba(0, 85, 255, 0.14), rgba(0, 212, 255, 0.05));
      color: var(--white);
      text-align: right;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.26);
      transition: transform 170ms ease, border-color 170ms ease, box-shadow 170ms ease;
    }

    .task-card:hover {
      transform: translateY(-3px);
      border-color: rgba(0, 212, 255, 0.74);
      box-shadow: 0 0 24px rgba(0, 85, 255, 0.34);
    }

    .task-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 12px;
    }

    .task-id,
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .task-id {
      color: var(--neon);
      background: rgba(0, 85, 255, 0.28);
      direction: ltr;
      font-family: Consolas, "Courier New", monospace;
    }

    .chip {
      background: rgba(255, 255, 255, 0.06);
      color: #d1d5db;
    }

    .chip.high {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
    }

    .chip.blue {
      background: rgba(0, 85, 255, 0.16);
      color: #93c5fd;
    }

    .task-title {
      margin: 0 0 14px;
      font-size: 1rem;
      line-height: 1.55;
      font-weight: 800;
    }

    .task-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 0.78rem;
    }

    .truncate {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress {
      width: 100%;
      height: 6px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin-top: 13px;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0;
      min-width: 2px;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--neon));
    }

    .empty-state {
      padding: 54px 20px;
      border-radius: 18px;
      text-align: center;
      color: var(--muted);
    }

    .start-marker {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--blue-light);
      font-size: 0.8rem;
      font-weight: 800;
      margin-top: 16px;
    }

    .start-marker::before {
      content: "";
      width: 19px;
      height: 19px;
      margin-bottom: 8px;
      border-radius: 50%;
      border: 1px solid rgba(0, 85, 255, 0.8);
      background: rgba(0, 85, 255, 0.34);
      box-shadow: inset 0 0 0 6px var(--bg);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.74);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .modal {
      width: min(720px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow: auto;
      border-radius: 18px;
      border: 1px solid rgba(0, 150, 255, 0.34);
      background: rgba(8, 16, 38, 0.96);
      box-shadow: 0 0 70px rgba(0, 85, 255, 0.22);
    }

    .modal-bar {
      height: 6px;
      background: linear-gradient(90deg, var(--neon), var(--blue), var(--purple));
    }

    .modal-content {
      padding: 24px;
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      color: var(--white);
      font-size: 1.2rem;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .detail {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(3, 7, 18, 0.52);
      line-height: 1.6;
    }

    .detail.wide {
      grid-column: 1 / -1;
    }

    .detail-label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 4px;
    }

    .name-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .day-filter {
      padding: 14px;
      border-radius: 12px;
      background: rgba(3, 7, 18, 0.46);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }

    .weekday-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .weekday-grid label {
      display: flex;
      gap: 8px;
      align-items: center;
      color: #e5e7eb;
      font-size: 0.84rem;
      cursor: pointer;
      user-select: none;
    }

    .empty-days-list {
      max-height: 260px;
      overflow: auto;
      display: grid;
      gap: 8px;
    }

    .day-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.24);
      font-size: 0.86rem;
    }

    .iso {
      direction: ltr;
      font-family: Consolas, "Courier New", monospace;
      color: #c4b5fd;
      font-weight: 800;
    }

    .fade {
      animation: fade 240ms ease both;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 12px;
      }

      .app-header,
      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .header-actions,
      .toolbar-left,
      .button {
        width: 100%;
      }

      .button {
        min-height: 44px;
      }

      .search-box {
        width: 100%;
      }

      .timeline::before,
      .timeline-dot {
        right: 12px;
        transform: none;
      }

      .task-row,
      .task-row.left,
      .task-row.right {
        justify-content: flex-start;
        padding-right: 42px;
      }

      .task-card {
        width: 100%;
      }

      .detail-grid,
      .weekday-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="glow"></div>
  <main id="app"></main>

  <script>
    "use strict";

    const state = {
      tasks: [],
      step: "input",
      currentInput: "",
      selectedTaskId: null,
      selectedMonth: "الكل",
      selectedPriority: "الكل",
      searchQuery: "",
      showEmptyDaysModal: false,
      activeWeekdays: { 0: true, 1: true, 2: true, 3: true, 4: true, 5: true, 6: true }
    };

    const ARABIC_MONTHS_MAP = {
      "يناير": "01",
      "فبراير": "02",
      "مارس": "03",
      "أبريل": "04",
      "ابريل": "04",
      "مايو": "05",
      "يونيو": "06",
      "يوليو": "07",
      "أغسطس": "08",
      "اغسطس": "08",
      "سبتمبر": "09",
      "أكتوبر": "10",
      "اكتوبر": "10",
      "نوفمبر": "11",
      "ديسمبر": "12"
    };

    const WEEKDAY_NAMES = [
      { id: 0, name: "الأحد" },
      { id: 1, name: "الإثنين" },
      { id: 2, name: "الثلاثاء" },
      { id: 3, name: "الأربعاء" },
      { id: 4, name: "الخميس" },
      { id: 5, name: "الجمعة" },
      { id: 6, name: "السبت" }
    ];

    const app = document.getElementById("app");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function clampProgress(progress) {
      const match = String(progress || "").match(/\d+/);
      const value = match ? Math.max(0, Math.min(100, Number(match[0]))) : 0;
      return value + "%";
    }

    function parseArabicDate(dateStr) {
      if (!dateStr) return 0;
      try {
        const cleaned = dateStr.replace(/,/g, "").trim();
        const parts = cleaned.split(/\s+/);
        if (parts.length >= 3) {
          const month = ARABIC_MONTHS_MAP[parts[0]] || "01";
          const day = String(parts[1]).padStart(2, "0");
          const year = parts[2];
          const time = parts[3] || "00:00:00";
          return new Date(`${year}-${month}-${day}T${time}`).getTime();
        }
      } catch (error) {
        return 0;
      }
      return 0;
    }

    function parseRawText(rawText) {
      const months = "يناير|فبراير|مارس|أبريل|ابريل|مايو|يونيو|يوليو|أغسطس|اغسطس|سبتمبر|أكتوبر|اكتوبر|نوفمبر|ديسمبر";
      const dateRegex = new RegExp(`(${months})\\s+\\d{1,2},?\\s+\\d{4}\\s+\\d{2}:\\d{2}:\\d{2}`, "g");
      const matches = [];
      let match;
      while ((match = dateRegex.exec(rawText)) !== null) {
        matches.push({ index: match.index, text: match[0] });
      }

      const parsedTasks = [];
      let startIndex = 0;

      for (let i = 0; i < matches.length; i += 1) {
        const chunk = rawText.substring(startIndex, matches[i].index).trim();
        const createdAt = matches[i].text;
        startIndex = matches[i].index + matches[i].text.length;

        if (!chunk) continue;

        const idMatch = chunk.match(/^(\d{3,8})\s*/);
        const anyIdMatch = chunk.match(/\d{3,8}/);
        const id = idMatch ? idMatch[1] : (anyIdMatch ? anyIdMatch[0] : `بدون-${parsedTasks.length + 1}`);

        const lines = chunk.split("\n").map(line => line.trim()).filter(Boolean);
        let title = "مهمة بدون عنوان";
        if (lines.length > 0) {
          if (/^\d{3,8}$/.test(lines[0]) && lines.length > 1) {
            title = lines[1];
          } else {
            title = lines[0].replace(/^\d{3,8}\s*/, "").trim();
            if (!title && lines.length > 1) title = lines[1];
          }
          title = title.replace(/(High|Medium|Low|بانتظار الموافقة|مكتمل)/ig, "").trim() || "مهمة بدون عنوان";
        }

        let priority = "Medium";
        if (/High|عالية|عالي/i.test(chunk)) priority = "High";
        else if (/Low|منخفضة|منخفض/i.test(chunk)) priority = "Low";
        else if (/Medium|متوسطة|متوسط/i.test(chunk)) priority = "Medium";

        const progressMatch = chunk.match(/(\d+)%/);
        const progress = clampProgress(progressMatch ? progressMatch[0] : "0%");

        let status = "غير محدد";
        if (/مكتمل|تم اكتمال/i.test(chunk)) status = "مكتمل";
        else if (/بانتظار الموافقة/i.test(chunk)) status = "بانتظار الموافقة";
        else if (/قيد التنفيذ/i.test(chunk)) status = "قيد التنفيذ";

        const attachmentsMatch = chunk.match(/(\d+)\s*(مرفق|مرفقات|مرفقاً|attachments)/i);
        const attachmentsCount = attachmentsMatch ? attachmentsMatch[1] : "0";

        const dates = [...new Set(chunk.match(/\d{4}-\d{2}-\d{2}/g) || [])];
        const dateRange = dates.length > 0 ? dates.join(" - ") : "غير محدد";

        const names = lines.filter(line =>
          /السيد سالم|عبدالفتاح|البراوي|هشام ياسين|جمال السيد|القحطاني|بسام مسعود/.test(line)
        );

        const owner = names.find(name => name.includes("بسام مسعود")) || "بسام مسعود السيد سالم";
        const creator = names.find(name => !name.includes("بسام مسعود")) || "محمد ابراهيم عبدالفتاح عرفات";
        let assignees = [];
        if (chunk.includes("المعينون") || chunk.includes("عرض")) {
          assignees = names.filter(name => name !== owner);
        }
        if (assignees.length === 0) assignees = [creator];

        parsedTasks.push({
          id,
          title: title.substring(0, 140),
          priority,
          progress,
          status,
          attachmentsCount,
          owner,
          creator,
          assignees: [...new Set(assignees)],
          dateRange,
          parsedDates: dates,
          createdAt,
          timestamp: parseArabicDate(createdAt),
          rawChunk: chunk,
          uid: `${id}-${createdAt}-${parsedTasks.length}`
        });
      }

      return parsedTasks;
    }

    function getMonthlyStats() {
      const stats = {};
      for (const task of state.tasks) {
        if (!task.createdAt) continue;
        const parts = task.createdAt.trim().split(/\s+/);
        const label = `${parts[0] || "غير محدد"} ${parts[2] || ""}`.trim();
        stats[label] = (stats[label] || 0) + 1;
      }
      return stats;
    }

    function getFilteredTasks() {
      const query = state.searchQuery.trim().toLowerCase();
      return state.tasks.filter(task => {
        let matchMonth = true;
        if (state.selectedMonth !== "الكل") {
          const parts = task.createdAt.trim().split(/\s+/);
          matchMonth = `${parts[0]} ${parts[2]}`.trim() === state.selectedMonth;
        }

        const matchPriority = state.selectedPriority === "الكل" || task.priority === state.selectedPriority;
        let matchSearch = true;
        if (query) {
          matchSearch =
            task.title.toLowerCase().includes(query) ||
            task.id.toLowerCase().includes(query) ||
            task.owner.toLowerCase().includes(query);
        }

        return matchMonth && matchPriority && matchSearch;
      });
    }

    function getEmptyDaysList() {
      if (state.tasks.length < 2) return [];

      const activeDates = new Set();
      const timestamps = [];

      for (const task of state.tasks) {
        if (task.parsedDates && task.parsedDates.length > 0) {
          const times = task.parsedDates
            .map(date => new Date(date + "T00:00:00").getTime())
            .filter(time => !Number.isNaN(time));

          if (times.length > 0) {
            const minT = Math.min(...times);
            const maxT = Math.max(...times);
            timestamps.push(minT, maxT);

            for (let current = minT; current <= maxT; current += 86400000) {
              const date = new Date(current);
              activeDates.add(formatIsoDate(date));
            }
          }
        } else if (task.timestamp > 0) {
          timestamps.push(task.timestamp);
          activeDates.add(formatIsoDate(new Date(task.timestamp)));
        }
      }

      if (timestamps.length === 0) return [];
      const minTime = Math.min(...timestamps);
      const maxTime = Math.max(...timestamps);
      const emptyDays = [];

      for (let current = minTime + 86400000; current < maxTime; current += 86400000) {
        const date = new Date(current);
        const iso = formatIsoDate(date);
        if (!activeDates.has(iso) && state.activeWeekdays[date.getDay()]) {
          emptyDays.push({
            iso,
            arabic: date.toLocaleDateString("ar-SA", {
              weekday: "long",
              year: "numeric",
              month: "long",
              day: "numeric"
            })
          });
        }
      }

      return emptyDays;
    }

    function formatIsoDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function headerHtml(emptyDaysCount) {
      return `
        <header class="app-header glass">
          <div class="brand">
            <div class="logo" aria-hidden="true">د</div>
            <div>
              <h1>لوحة تحليل المهام التفاعلية</h1>
              <p class="subtitle"><span class="pulse"></span>فريق التدريب والتطوير بدرعه</p>
            </div>
          </div>
          <div class="header-actions">
            ${state.tasks.length ? `<button class="button danger" data-action="reset">ابدأ من جديد</button>` : ""}
            ${state.step === "timeline" ? `
              <button class="button purple" data-action="show-empty-days">أيام بدون مهام (${emptyDaysCount})</button>
              <button class="button success" data-action="export-csv">تصدير CSV</button>
            ` : ""}
          </div>
        </header>
      `;
    }

    function renderInput() {
      return `
        <section class="section glass input-panel fade">
          <h2 class="section-title">الصق بيانات المهام هنا</h2>
          <p class="help-text">انسخ بيانات المهام أو الجدول من النظام والصقها هنا. النسخة دي تعمل محلياً بدون تحميل React أو Babel أو Tailwind من الإنترنت.</p>
          <textarea id="task-input" placeholder="الصق بيانات الجدول المنسوخة هنا..." dir="rtl">${escapeHtml(state.currentInput)}</textarea>
          <div class="row">
            <span class="help-text" style="margin:0">سيتم استخراج المهام عند وجود تواريخ إنشاء بصيغة: مايو 12, 2026 15:58:17</span>
            <button class="button primary" id="process-btn" data-action="process" ${state.currentInput.trim() ? "" : "disabled"}>تحليل واستخراج البيانات</button>
          </div>
        </section>
      `;
    }

    function renderAskMore() {
      return `
        <section class="section glass center-panel fade">
          <div class="big-mark">✓</div>
          <h2>تم سحب الصفحة بنجاح</h2>
          <p class="help-text">تم استخراج <strong style="color:var(--neon);font-size:1.2rem">${state.tasks.length}</strong> مهمة حتى الآن.</p>
          <div class="note">
            <strong>هل توجد صفحة أخرى تريد نسخها وتجميعها؟</strong><br>
            يمكنك الرجوع للنظام ونسخ الصفحة التالية لإضافتها لنفس التقرير.
          </div>
          <div class="row" style="justify-content:center">
            <button class="button secondary" data-action="more-input">نعم، إضافة صفحة أخرى</button>
            <button class="button primary" data-action="finish">لا، توليد الخط الزمني</button>
          </div>
        </section>
      `;
    }

    function renderTimeline() {
      const stats = getMonthlyStats();
      const filteredTasks = getFilteredTasks();

      return `
        <section class="section glass fade">
          <h3 class="section-title">إحصائيات المهام لكل شهر</h3>
          <div class="stats-grid">
            <button class="stat-card ${state.selectedMonth === "الكل" ? "active" : ""}" data-action="month" data-month="الكل">
              <span class="stat-title">كافة الشهور</span>
              <span class="stat-value">${state.tasks.length}</span>
              <span class="stat-caption">إجمالي المهام</span>
            </button>
            ${Object.entries(stats).map(([month, count]) => `
              <button class="stat-card ${state.selectedMonth === month ? "active" : ""}" data-action="month" data-month="${escapeHtml(month)}">
                <span class="stat-title">${escapeHtml(month)}</span>
                <span class="stat-value">${count}</span>
                <span class="stat-caption">مهمة</span>
              </button>
            `).join("")}
          </div>
        </section>

        <section class="toolbar glass">
          <div class="toolbar-left">
            <strong style="color:var(--muted)">الأولوية:</strong>
            <div class="segmented" role="group" aria-label="فلترة الأولوية">
              ${["الكل", "High", "Medium", "Low"].map(priority => `
                <button class="${state.selectedPriority === priority ? "active" : ""}" data-action="priority" data-priority="${priority}">${priority}</button>
              `).join("")}
            </div>
            <div class="search-box">
              <input id="search-input" type="text" value="${escapeHtml(state.searchQuery)}" placeholder="ابحث باسم المهمة أو المعرف..." dir="rtl">
            </div>
          </div>
          <div style="color:var(--muted)">يعرض حالياً: <strong style="color:var(--neon)">${filteredTasks.length}</strong> من أصل <strong>${state.tasks.length}</strong></div>
        </section>

        <section class="timeline fade">
          ${filteredTasks.length ? filteredTasks.map((task, index) => taskCardHtml(task, index)).join("") : `
            <div class="empty-state glass">
              <h3>لا توجد مهام تطابق خيارات الفلترة الحالية</h3>
              <p>غيّر الشهر أو الأولوية أو البحث لعرض النتائج.</p>
            </div>
          `}
          <div class="start-marker">نقطة البداية الزمنية (الأقدم)</div>
        </section>
      `;
    }

    function taskCardHtml(task, index) {
      const side = index % 2 === 0 ? "left" : "right";
      const priorityClass = task.priority === "High" ? "high" : (task.priority === "Low" ? "low" : "");
      return `
        <article class="task-row ${side}">
          <span class="timeline-dot ${priorityClass}" aria-hidden="true"></span>
          <button class="task-card" data-action="select-task" data-uid="${escapeHtml(task.uid)}">
            <div class="task-meta">
              <span class="task-id">#${escapeHtml(task.id)}</span>
              <span>${escapeHtml(task.createdAt.split(" ")[0] || "")} ${escapeHtml(task.createdAt.split(" ")[1] || "")}</span>
            </div>
            <h3 class="task-title">${escapeHtml(task.title || "مهمة بدون عنوان")}</h3>
            <div class="task-footer">
              <span class="truncate">المعين: ${escapeHtml(task.assignees[0] || "غير معين")}</span>
              <span class="chip ${task.priority === "High" ? "high" : "blue"}">${escapeHtml(task.priority)}</span>
            </div>
            <div class="progress" aria-label="نسبة الإنجاز"><span style="width:${escapeHtml(task.progress)}"></span></div>
            <div style="text-align:left;color:var(--blue-light);font-size:.76rem;margin-top:5px">${escapeHtml(task.progress)} إنجاز</div>
          </button>
        </article>
      `;
    }

    function renderTaskModal(task) {
      return `
        <div class="modal-backdrop" data-action="close-modal">
          <section class="modal" role="dialog" aria-modal="true" aria-label="تفاصيل المهمة" onclick="event.stopPropagation()">
            <div class="modal-bar"></div>
            <div class="modal-content">
              <div class="modal-head">
                <div>
                  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
                    <span class="task-id">#${escapeHtml(task.id)}</span>
                    <span class="chip ${task.priority === "High" ? "high" : "blue"}">أولوية: ${escapeHtml(task.priority)}</span>
                    <span class="chip">المرفقات: ${escapeHtml(task.attachmentsCount)}</span>
                  </div>
                  <h2 style="margin:0;line-height:1.5">${escapeHtml(task.title)}</h2>
                </div>
                <button class="close-btn" data-action="close-modal" aria-label="إغلاق">×</button>
              </div>
              <div class="detail-grid">
                <div class="detail"><span class="detail-label">تاريخ الإنشاء</span>${escapeHtml(task.createdAt)}</div>
                <div class="detail"><span class="detail-label">الحالة الحالية</span>${escapeHtml(task.status)}</div>
                <div class="detail"><span class="detail-label">مالك المهمة</span>${escapeHtml(task.owner)}</div>
                <div class="detail"><span class="detail-label">أنشأها</span>${escapeHtml(task.creator)}</div>
                <div class="detail wide" dir="ltr"><span class="detail-label" dir="rtl">النطاق الزمني للتنفيذ</span>${escapeHtml(task.dateRange)}</div>
                <div class="detail wide">
                  <span class="detail-label">المعينون للمهمة (${task.assignees.length})</span>
                  <div class="name-list">
                    ${task.assignees.map(name => `<span class="chip blue">${escapeHtml(name)}</span>`).join("")}
                  </div>
                </div>
                <div class="detail wide">
                  <span class="detail-label">نسبة الإنجاز: ${escapeHtml(task.progress)}</span>
                  <div class="progress"><span style="width:${escapeHtml(task.progress)}"></span></div>
                </div>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function renderEmptyDaysModal(emptyDays) {
      return `
        <div class="modal-backdrop" data-action="close-empty-days">
          <section class="modal" role="dialog" aria-modal="true" aria-label="الأيام الخالية" onclick="event.stopPropagation()">
            <div class="modal-bar" style="background:var(--purple)"></div>
            <div class="modal-content">
              <div class="modal-head">
                <h2 style="margin:0">أيام خالية بدون أي مهام</h2>
                <button class="close-btn" data-action="close-empty-days" aria-label="إغلاق">×</button>
              </div>
              <div class="day-filter">
                <strong style="color:var(--muted);font-size:.88rem">تضمين أيام الأسبوع في الحساب:</strong>
                <div class="weekday-grid">
                  ${WEEKDAY_NAMES.map(day => `
                    <label>
                      <input type="checkbox" data-action="weekday" data-day="${day.id}" ${state.activeWeekdays[day.id] ? "checked" : ""}>
                      ${day.name}
                    </label>
                  `).join("")}
                </div>
              </div>
              <p class="help-text">الأيام الفارغة المكتشفة التي لا يقع ضمنها أي نطاق زمني للمهام:</p>
              <div class="empty-days-list">
                ${emptyDays.length ? emptyDays.map(day => `
                  <div class="day-row">
                    <span>${escapeHtml(day.arabic)}</span>
                    <span class="iso">${escapeHtml(day.iso)}</span>
                  </div>
                `).join("") : `<div class="empty-state">لا توجد أيام خالية تطابق الفلترة الحالية.</div>`}
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function render() {
      const emptyDays = getEmptyDaysList();
      const selectedTask = state.tasks.find(task => task.uid === state.selectedTaskId);

      let body = "";
      if (state.step === "input") body = renderInput();
      else if (state.step === "ask_more") body = renderAskMore();
      else body = renderTimeline();

      app.innerHTML = `
        ${headerHtml(emptyDays.length)}
        ${body}
        ${selectedTask ? renderTaskModal(selectedTask) : ""}
        ${state.showEmptyDaysModal ? renderEmptyDaysModal(emptyDays) : ""}
      `;

      bindInputs();
    }

    function bindInputs() {
      const textarea = document.getElementById("task-input");
      const processBtn = document.getElementById("process-btn");
      if (textarea && processBtn) {
        textarea.addEventListener("input", () => {
          state.currentInput = textarea.value;
          processBtn.disabled = !state.currentInput.trim();
        });
      }

      const searchInput = document.getElementById("search-input");
      if (searchInput) {
        searchInput.addEventListener("input", () => {
          state.searchQuery = searchInput.value;
          render();
        });
      }
    }

    app.addEventListener("click", event => {
      const target = event.target.closest("[data-action]");
      if (!target) return;

      const action = target.dataset.action;

      if (action === "process") {
        const input = document.getElementById("task-input");
        state.currentInput = input ? input.value : state.currentInput;
        if (!state.currentInput.trim()) return;
        state.tasks = state.tasks.concat(parseRawText(state.currentInput));
        state.currentInput = "";
        state.step = "ask_more";
        render();
      }

      if (action === "more-input") {
        state.step = "input";
        render();
      }

      if (action === "finish") {
        state.tasks = [...state.tasks].sort((a, b) => a.timestamp - b.timestamp);
        state.step = "timeline";
        render();
      }

      if (action === "reset") {
        if (window.confirm("هل أنت متأكد من حذف كافة المهام الحالية والبدء من جديد؟")) {
          state.tasks = [];
          state.currentInput = "";
          state.step = "input";
          state.selectedTaskId = null;
          state.selectedMonth = "الكل";
          state.selectedPriority = "الكل";
          state.searchQuery = "";
          state.activeWeekdays = { 0: true, 1: true, 2: true, 3: true, 4: true, 5: true, 6: true };
          render();
        }
      }

      if (action === "month") {
        state.selectedMonth = target.dataset.month || "الكل";
        render();
      }

      if (action === "priority") {
        state.selectedPriority = target.dataset.priority || "الكل";
        render();
      }

      if (action === "select-task") {
        state.selectedTaskId = target.dataset.uid;
        render();
      }

      if (action === "close-modal") {
        state.selectedTaskId = null;
        render();
      }

      if (action === "show-empty-days") {
        state.showEmptyDaysModal = true;
        render();
      }

      if (action === "close-empty-days") {
        state.showEmptyDaysModal = false;
        render();
      }
    });

    app.addEventListener("change", event => {
      const target = event.target.closest("[data-action='weekday']");
      if (!target) return;
      state.activeWeekdays[target.dataset.day] = target.checked;
      render();
    });

    const glow = document.getElementById("glow");
    window.addEventListener("mousemove", event => {
      glow.style.left = event.clientX + "px";
      glow.style.top = event.clientY + "px";
      glow.style.opacity = "1";
    });

    render();
  </script>
</body>
</html>
